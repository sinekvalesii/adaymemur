# Kotlin/Compose yerel Android projesini (android-native/) derler ve doğrular.
name: Android (yerel) derleme

on:
  push:
    branches: [main]
    paths: ["android-native/**", ".github/workflows/android-yerel.yml"]
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Derle (debug APK + release AAB) ve lint
        run: ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aday-memur-yerel-${{ github.run_number }}
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/outputs/bundle/release/*.aab
            android-native/app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  ekran:
    needs: derle
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: android-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emülatörde ekran görüntüleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android-native
          script: ./ci/ekran.sh
      - name: Görüntüleri ekran-goruntuleri dalına gönder
        run: |
          cd ekranlar
          git init -q -b ekran-goruntuleri
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Ekran görüntüleri ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ekran-goruntuleri
