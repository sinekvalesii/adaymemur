# Kotlin/Compose yerel Android projesini (android-native/) derler ve doğrular.
name: Android (yerel) derleme

on:
  push:
    branches: [main]
    paths: ["android-native/**", ".github/workflows/android-yerel.yml"]
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Derle (debug APK + release AAB) ve lint
        run: ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aday-memur-yerel-${{ github.run_number }}
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/outputs/bundle/release/*.aab
            android-native/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
