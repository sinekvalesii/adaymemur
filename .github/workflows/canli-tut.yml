# GitHub, 60 gün commit almayan depolarda zamanlanmış görevleri durdurur. Bu görev ayda bir boş commit atar.
name: Zamanlayıcıyı canlı tut
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: zamanlayıcıyı canlı tut"
          git push
