# İmzalı Android App Bundle (.aab) ve test için APK üretir.
# Gerekli repo gizlileri (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64 (Firebase; yoksa bildirim/forum kapalı derlenir)
# İsteğe bağlı repo değişkenleri: ADMOB_ANDROID_APP_ID, ADMOB_BANNER_ID, ADMOB_INLINE_ID,
#   REVENUECAT_ANDROID_KEY, SUPPORT_EMAIL, SITE_URL
name: Android sürümü

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (her yüklemede bir artır)"
        required: true
        default: "1"
  push:
    tags: ["v*"]

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: app } }
    env:
      ANDROID_VERSION_CODE: ${{ github.event.inputs.versionCode || github.run_number }}
      ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
      EXPO_PUBLIC_ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      EXPO_PUBLIC_ADMOB_INLINE_ID: ${{ vars.ADMOB_INLINE_ID }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.REVENUECAT_ANDROID_KEY }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run typecheck && npm test

      - name: Firebase yapılandırması
        env: { GS: "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" }
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > google-services.json; echo "Firebase: açık"; else echo "::warning::GOOGLE_SERVICES_JSON_BASE64 yok — bildirim ve forum kapalı derlenecek"; fi

      - name: Yerel proje üret
        run: npx expo prebuild --platform android --clean --no-install

      - name: Yükleme anahtarı
        env: { KS: "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$KS" ]; then echo "::error::UPLOAD_KEYSTORE_BASE64 tanımlı değil"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "AM_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: AAB ve APK derle
        working-directory: app/android
        env:
          AM_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          AM_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          AM_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: aday-memur-${{ env.ANDROID_VERSION_CODE }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/release/*.apk
